e-width="3" stroke-linecap="round"/><rect x="37" y="77" width="24" height="7" rx="3.5" fill="#5EACFF"/><ellipse cx="108" cy="145" rx="26" ry="27" fill="#1375CC"/><ellipse cx="104" cy="142" rx="26" ry="27" fill="url(#budget-blue)" stroke="#A3D8FF" stroke-width="1.2"/><path d="M113 131c-2-3-5-4-8-4-7 0-12 6-12 15s5 15 12 15c3 0 6-1 8-4m-24-15h19m-19 8h16" fill="none" stroke="#FFFFFF" stroke-width="2.7" stroke-linecap="round"/><path d="M25 182h67" stroke="#B4D1E9" stroke-width="4" stroke-linecap="round"/><circle cx="118" cy="182" r="5" fill="#2997FF"/></g><g transform="matrix(1 -.33 0 1 122 261)" filter="url(#budget-card-shadow)"><path d="M0 0-12-8v203l12 11Z" fill="#78ADE0"/><path d="M0 0-12-8h146l12 8Z" fill="#E4F2FF"/><rect x="0" y="0" width="146" height="206" rx="13" fill="url(#budget-face)" stroke="#C0DDF7" stroke-width="1.2"/><rect x="15" y="17" width="116" height="31" rx="8" fill="#E4F1FF"/><text x="73" y="38" text-anchor="middle" fill="#244462" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="700">Janvier</text><rect x="24" y="65" width="74" height="92" rx="7" fill="#FBFBFD" stroke="#B7D3EC"/><path d="M76 65v22h22" fill="#D8ECFE" stroke="#B7D3EC" stroke-width="1"/><path d="M37 103h46m-46 13h35m-35 13h42m-42 13h25" stroke="#9BBBD7" stroke-width="3" stroke-linecap="round"/><rect x="37" y="77" width="24" height="7" rx="3.5" fill="#5EACFF"/><ellipse cx="108" cy="145" rx="26" ry="27" fill="#1375CC"/><ellipse cx="104" cy="142" rx="26" ry="27" fill="url(#budget-blue)" stroke="#A3D8FF" stroke-width="1.2"/><path d="M113 131c-2-3-5-4-8-4-7 0-12 6-12 15s5 15 12 15c3 0 6-1 8-4m-24-15h19m-19 8h16" fill="none" stroke="#FFFFFF" stroke-width="2.7" stroke-linecap="round"/><path d="M25 182h67" stroke="#B4D1E9" stroke-width="4" stroke-linecap="round"/><circle cx="118" cy="182" r="5" fill="#2997FF"/></g><path d="M238 424C287 454 311 390 350 388S417 409 437 362 488 330 529 319" fill="none" stroke="#E9F6FF" stroke-width="15" stroke-linecap="round"/>
<path d="M238 424C287 454 311 390 350 388S417 409 437 362 488 330 529 319" fill="none" stroke="#2997FF" stroke-width="3" stroke-linecap="round"/>
<g class="budget-pulse"><circle cx="350" cy="388" r="14" fill="#2997FF" opacity=".13"/><circle cx="350" cy="388" r="6" fill="#FBFBFD" stroke="#2997FF" stroke-width="3"/></g>
<circle cx="529" cy="319" r="6" fill="#FBFBFD" stroke="#2997FF" stroke-width="3"/>
