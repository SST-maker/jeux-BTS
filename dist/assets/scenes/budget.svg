<svg xmlns="http://www.w3.org/2000/svg" width="760" height="560" viewBox="0 0 760 560" role="img" aria-labelledby="budget-title budget-desc">
<title id="budget-title">Le passage d'un mois au suivant</title>
<desc id="budget-desc">Trois panneaux isométriques marqués Janvier, Février et Mars, reliés par des flux bleus. Des documents et des jetons illustrent la différence entre les prévisions de vente et le calendrier des encaissements. Aucune valeur chiffrée n'est représentée.</desc>
<defs>
<linearGradient id="budget-face" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#FFFFFF" stop-opacity=".98"/><stop offset="1" stop-color="#D7ECFF" stop-opacity=".98"/></linearGradient>
<linearGradient id="budget-side" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#A3D0FA"/><stop offset="1" stop-color="#3C8ED5"/></linearGradient>
<linearGradient id="budget-blue" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#71BDFF"/><stop offset="1" stop-color="#1476D1"/></linearGradient>
<linearGradient id="budget-dark" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#344A62"/><stop offset="1" stop-color="#1D1D1F"/></linearGradient>
<linearGradient id="budget-base" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#F9FCFF"/><stop offset="1" stop-color="#C5E2FD"/></linearGradient>
<radialGradient id="budget-halo"><stop stop-color="#2997FF" stop-opacity=".22"/><stop offset="1" stop-color="#2997FF" stop-opacity="0"/></radialGradient>
<filter id="budget-shadow" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="13"/></filter>
<filter id="budget-card-shadow" x="-30%" y="-30%" width="180%" height="180%"><feDropShadow dx="-8" dy="16" stdDeviation="8" flood-color="#0D3F72" flood-opacity=".15"/></filter>
</defs>
<style>.budget-flow{stroke-dasharray:7 12;animation:budget-flow 10s linear infinite}.budget-pulse{animation:budget-pulse 4s ease-in-out infinite}@keyframes budget-flow{to{stroke-dashoffset:-190}}@keyframes budget-pulse{0%,100%{opacity:.45}50%{opacity:1}}@media(prefers-reduced-motion:reduce){.budget-flow,.budget-pulse{animation:none}}</style>
<ellipse cx="393" cy="365" rx="353" ry="160" fill="url(#budget-halo)"/>
<ellipse cx="386" cy="430" rx="272" ry="66" fill="#133E6B" opacity=".15" filter="url(#budget-shadow)"/>
<path d="M56 379 522 192 717 315 251 507Z" fill="#87B9E7"/>
<path d="M56 365 522 178 717 301 251 493Z" fill="url(#budget-base)" stroke="#DBEEFF" stroke-width="1.5"/>
<path d="M56 365v14l195 128v-14Z" fill="#A9D0F1"/>
<path d="M251 493v14l466-192v-14Z" fill="#639FD2"/>
<!-- Thin milled paths on the presentation deck. -->
<path d="m91 364 424-171m-386 197 424-170m-384 197 424-171m-383 197 424-171" fill="none" stroke="#AFCFEF" stroke-width=".8"/>
<path d="m172 318 167 106m-76-142 167 106m-75-142 167 106m-76-142 167 106" fill="none" stroke="#AFCFEF" stroke-width=".8"/>
<!-- Back flow: commitments move across the calendar. -->
<path d="M149 246C111 140 206 90 294 135S415 211 499 123" stroke="#7DBDF7" stroke-opacity=".35" stroke-width="13" fill="none"/>
<path class="budget-flow" d="M149 246C111 140 206 90 294 135S415 211 499 123" stroke="#2997FF" stroke-width="2.5" fill="none"/>
