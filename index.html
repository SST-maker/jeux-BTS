  function questionHTML(q,i){const a=state.answers[q.id],done=C.done(a);const hint=openHints.has(q.id);let fields='';

  function renderReport(keepScroll=false){if(!C.coreDone(game,state))return;view='report';renderHeader();const st=C.stats(game,state),bonus=C.stats(game,state,true);main.innerHTML='<div class="wrap report-page enter"><section class="report-hero"><div><p class="eyebrow">'+esc(game.company)+' · GO '+esc(game.year)+'</p><h1>Les chiffres sont prêts<br>À toi de conclure</h1><p>Le parcours principal est terminé. Rédige maintenant ta recommandation : une décision utile s’appuie sur des chiffres et un raisonnement</p></div><div class="report-seal" aria-hidden="true">'+icon('shield')+'</div></section><div class="score-grid"><div><strong>'+st.completed+' / '+st.total+'</strong><span>Contrôles du parcours terminés</span></div><div><strong>'+st.first+' / '+st.total+'</strong><span>Réussis au premier essai, sans indice</span></div><div><strong>'+st.hints+'</strong><span>Contrôles avec un indice consulté</span></div><div><strong>'+st.guided+'</strong><span>Corrections consultées</span></div></div><div class="report-layout"><section class="report-compose"><h2>'+esc(game.report.title)+'</h2><p>'+esc(game.report.prompt)+'</p><label class="input-label" for="report-text">Ta recommandation argumentée</label><textarea id="report-text" maxlength="6000" placeholder="Appuie ta décision sur les résultats de la mission…">'+esc(state.report)+'</textarea><div class="writing-meta"><span id="writing-count">'+state.report.trim().length+' caractères · minimum '+game.report.minLength+'</span><span>Texte à relire avec le formateur, sans note automatique.</span></div><div class="criteria">'+game.report.checklist.map((c,i)=>'<label class="criterion"><input type="checkbox" data-criterion="'+i+'" '+(state.criteria.includes(i)?'checked':'')+'><span>'+esc(c)+'</span></label>').join('')+'</div><button class="btn" data-action="finalize" id="finalize" '+(!C.canReport(game,state)?'disabled':'')+'>Préparer mon bilan à rendre</button><p class="help">Relis ta note et coche les critères. Tu remettras ensuite le bilan à ton formateur.</p>'+(state.reportReady?exportHTML():'')+'</section><aside class="report-aside"><h2>Ton parcours</h2><div class="mission-recap">'+recap()+'</div>'+(bonus.total?'<p><strong>Prolongements facultatifs :</strong> '+bonus.completed+' / '+bonus.total+' contrôles terminés. Ils ne conditionnent pas le bilan du jour.</p>':'')+'<p>Ce bilan décrit ton entraînement. Il distingue les réponses trouvées, les indices et les démarches consultées.</p><button class="text-link" data-action="expected">Consulter les éléments attendus de la note</button><p class="help">Ta rédaction reste à apprécier par le formateur.</p></aside></div><div class="extra-actions"><a class="ghost" href="'+urlFor('hub')+'">'+icon('grid')+' Accueil des missions</a><button class="ghost" data-action="reset">'+icon('reset')+' Nouvelle session</button></div></div>';renderPrint();if(!keepScroll)focusMain();}
  function exportHTML(){return '<section class="export-box" id="export-box"><div class="export-success">'+icon('check')+' Ton bilan est prêt</div><h3>Garde une trace de ton travail</h3><p>Le fichier contient tes résultats, les aides utilisées et ta recommandation. Il n’est pas envoyé automatiquement au formateur.</p><div class="export-actions"><button class="btn" data-action="download">'+icon('download')+' Télécharger le bilan PDF</button><button class="btn secondary" data-action="download-text">Export texte détaillé</button><button class="btn secondary" data-action="print">'+icon('print')+' Imprimer / PDF</button></div><p class="help">Sauvegardé sur cet appareil. Télécharge-le avant de changer d’ordinateur.</p></section>';}

  function resultText(){const st=C.stats(game,state),bonus=C.stats(game,state,true);const lines=['NCR SOLUTIONS — BILAN INDIVIDUEL DE GESTION OPÉRATIONNELLE',game.title+' — '+game.company,'BTS MCO '+game.year+' — '+game.code,'Apprenant : '+(state.pseudo||'Non renseigné'),'Export : '+new Date().toLocaleString('fr-FR'),'','PARCOURS PRINCIPAL','Contrôles terminés : '+st.completed+'/'+st.total,'Premier essai sans indice : '+st.first+'/'+st.total,'Contrôles avec indice : '+st.hints,'Corrections consultées : '+st.guided,'Temps actif dans les missions : '+clock(),'Éléments attendus de la note consultés : '+(state.reportExampleUsed?'oui':'non'),bonus.total?'Prolongements facultatifs : '+bonus.completed+'/'+bonus.total:'','',game.report.title.toUpperCase(),state.report,'','Relecture déclarée par l’apprenant :',...game.report.checklist.map((x,i)=>(state.criteria.includes(i)?'[x] ':'[ ] ')+x),'','DÉTAIL DES CONTRÔLES'];game.missions.forEach(m=>{lines.push('',m.title+(m.optional?' (facultatif)':''));m.questions.forEach(q=>{const a=state.answers[q.id];lines.push('- '+q.label,'  Réponse : '+answerText(q,a.value),'  Statut : '+(a.status==='guided'?'démarche consultée':a.status==='valid'?'réponse validée':'non terminé')+' ; essais : '+a.attempts+' ; indice : '+(a.hintUsed?'oui':'non')+' ; correction consultée : '+(a.solutionUsed?'oui':'non'));if(a.firstValue!==null)lines.push('  Première réponse : '+answerText(q,a.firstValue));});});lines.push('','La note rédigée est à apprécier par le formateur, sans correction automatique.','Ce bilan d’entraînement est produit localement ; il ne constitue pas une note certifiée.','Aucun envoi automatique ni tableau de suivi collectif.');return lines.filter(x=>x!==undefined).join('\n');}

  async function downloadPDF(button){

  }
  function renderPrint(){if(!game||!state)return;const st=C.stats(game,state);$('#print-report').innerHTML='<img src="'+asset('assets/ncr-logo.png')+'" alt="NCR Solutions"><h1>Bilan individuel · Gestion opérationnelle</h1><p>'+esc(game.title)+' — '+esc(game.company)+'<br>BTS MCO '+esc(game.year)+' · '+esc(game.code)+'<br>Apprenant : '+esc(state.pseudo||'Non renseigné')+'<br>Édité le '+esc(new Date().toLocaleString('fr-FR'))+'</p><table><tbody><tr><th>Contrôles du jour terminés</th><td>'+st.completed+' / '+st.total+'</td></tr><tr><th>Premier essai sans indice</th><td>'+st.first+' / '+st.total+'</td></tr><tr><th>Indices consultés / corrections consultées</th><td>'+st.hints+' / '+st.guided+'</td></tr></tbody></table><h2>'+esc(game.report.title)+'</h2><p>'+esc(state.report)+'</p><h2>Relecture de l’apprenant</h2><p>'+game.report.checklist.map((x,i)=>(state.criteria.includes(i)?'☑ ':'☐ ')+esc(x)).join('<br>')+'</p><h2>Missions</h2><table><tbody>'+game.missions.map(m=>'<tr><th>'+esc(m.title)+(m.optional?' (facultatif)':'')+'</th><td>'+(C.missionDone(m,state)?'Terminé':'Non terminé')+'</td></tr>').join('')+'</tbody></table><p class="print-muted">Bilan d’entraînement local. La rédaction est à apprécier par le formateur et ne reçoit pas de note automatique. Modèle de note consulté : '+(state.reportExampleUsed?'oui':'non')+'. Les réponses, tentatives et aides sont détaillées dans le fichier texte téléchargeable.</p>';}
  function showDialog(title,content){lastFocus=document.activeElement;dialog.innerHTML='<div class="dialog-head"><h2 id="dialog-title">'+esc(title)+'</h2><button class="close" data-action="close" aria-label="Fermer">'+icon('close')+'</button></div>'+content;dialog.showModal();}
  function closeDialog(){dialog.close();if(lastFocus?.isConnected)lastFocus.focus();}
  function findQuestion(id){return game.missions.flatMap(m=>m.questions).find(q=>q.id===id);}
  function updateReportState(){state.reportReady=false;save();$('#finalize').disabled=!C.canReport(game,state);$('#writing-count').textContent=state.report.trim().length+' caractères · minimum '+game.report.minLength;$('#export-box')?.remove();renderPrint();}
  document.addEventListener('input',e=>{if(!game||!state)return;const el=e.target;if(el.dataset.question){const a=state.answers[el.dataset.question];if(!C.done(a)){a.value=el.value;a.feedback=false;save();}}else if(el.id==='report-text'){state.report=el.value;updateReportState();}});
  document.addEventListener('change',e=>{if(!game||!state)return;const el=e.target;if(el.dataset.question){const a=state.answers[el.dataset.question];if(!C.done(a)){a.value=el.value;a.feedback=false;save();}}else if(el.dataset.criterion!==undefined){const i=Number(el.dataset.criterion);state.criteria=state.criteria.filter(x=>x!==i);if(el.checked)state.criteria.push(i);updateReportState();}});
  document.addEventListener('keydown',e=>{if(e.key==='Enter'&&e.target.id==='pseudo'){$('[data-action="start"]')?.click();}if(e.key==='Enter'&&e.target.dataset?.question&&e.target.type==='text'){e.preventDefault();$('[data-action="verify"]')?.click();}});
  document.addEventListener('click',e=>{if(e.target.closest('.skip')){e.preventDefault();focusMain();return;}const button=e.target.closest('[data-action]');if(!button)return;const action=button.dataset.action;
    if(action==='subject'){if(catalog.subjects.some(x=>x.id===button.dataset.subject)){selectedSubject=button.dataset.subject;renderHub();$('[data-subject="'+selectedSubject+'"]')?.focus();}return;}
    if(action==='access-year'){renderAccess(Number(button.dataset.year));$('#class-code').focus();return;}
    if(action==='class-lock'){grants.clear();activeYear=null;pendingGame=null;try{sessionStorage.removeItem('ncr.class.access');}catch(e){}renderAccess();focusMain();return;}
    if(action==='close'){closeDialog();return;}
    if(action==='guide'){showDialog('Comment jouer', '<div class="reference-grid"><div class="reference-item"><b>Une session par élève</b><p>Choisis ton année. Ton pseudo est facultatif. Utilise une calculatrice et un brouillon ; aucun compte n’est nécessaire.</p></div><div class="reference-item"><b>Lis, calcule, puis décide</b><p>Le dossier fournit les données. Valide tes réponses : les bonnes sont conservées. Tu peux consulter un indice ; après deux essais, la correction détaillée devient accessible.</p></div><div class="reference-item"><b>Le score sert à comprendre ta progression</b><p>Le bilan distingue les réponses réussies au premier essai sans indice, les aides et les corrections consultées. Les fiches réflexes donnent les méthodes, sans pénalité.</p></div><div class="reference-item"><b>Rends ton raisonnement</b><p>Une note rédigée termine chaque parcours. Le formateur apprécie ce texte : il n’est pas noté automatiquement. Télécharge le bilan ou imprime-le en PDF.</p></div><div class="reference-item"><b>Sur ton appareil</b><p>La progression est enregistrée dans ce navigateur si le stockage local est autorisé. Elle ne se synchronise pas entre appareils. Aucun résultat n’est envoyé automatiquement. Sur un appareil partagé, télécharge ton bilan puis choisis « Nouvelle session ».</p></div></div>');return;}
    if(action==='project'){document.documentElement.classList.toggle('projected');renderHeader();$('[data-action="project"]')?.focus({preventScroll:true});announce(document.documentElement.classList.contains('projected')?'Textes agrandis.':'Taille normale.');return;}
    if(!game||!state)return;
    if(action==='reference'){showDialog('Les fiches réflexes','<p>Des repères de méthode à réutiliser pendant la mission</p><div class="reference-grid">'+game.glossary.map(x=>'<section class="reference-item"><b>'+esc(x.term)+'</b><p>'+esc(x.definition)+'</p></section>').join('')+'</div>');return;}
    if(action==='start'){state.pseudo=$('#pseudo').value.trim();state.started=true;state.createdAt=new Date().toISOString();state.mission=0;save();renderMission();return;}
    if(action==='mission'){const i=Number(button.dataset.index);if(C.unlocked(game,state,i)){state.mission=i;save();renderMission();}return;}
    if(action==='hint'){const q=findQuestion(button.dataset.q);const a=state.answers[q.id];a.hintUsed=true;if(openHints.has(q.id))openHints.delete(q.id);else openHints.add(q.id);save();const position=window.scrollY;renderMission(true);window.scrollTo(0,position);$('[data-action="hint"][data-q="'+q.id+'"]')?.focus({preventScroll:true});announce(openHints.has(q.id)?q.hint:'Indice masqué.');return;}
    if(action==='solution'){const q=findQuestion(button.dataset.q),a=state.answers[q.id];if(a.attempts<2||C.done(a))return;state.answers[q.id]=C.solve(q,a);state.reportReady=false;save();const position=window.scrollY;renderMission(true);window.scrollTo(0,position);const feedback=$('#feedback-'+q.id);feedback?.setAttribute('tabindex','-1');feedback?.focus({preventScroll:true});announce('Démarche consultée. '+q.explanation);if(C.missionDone(game.missions[state.mission],state))$('.mission-success')?.scrollIntoView({block:'center',behavior:scrollBehavior()});return;}
    if(action==='verify'){const m=game.missions[state.mission];m.questions.forEach(q=>{state.answers[q.id]=C.attempt(q,state.answers[q.id],state.answers[q.id].value);});state.reportReady=false;save();const position=window.scrollY;renderMission(true);const remaining=m.questions.filter(q=>!C.done(state.answers[q.id]));if(remaining.length){window.scrollTo(0,position);const first=$('#question-'+remaining[0].id);first?.scrollIntoView({block:'center',behavior:scrollBehavior()});const input=first?.querySelector('input');input?.focus({preventScroll:true});announce(remaining.length+' réponse'+(remaining.length>1?'s restent':' reste')+' à ajuster. Les bonnes réponses sont conservées.');}else{$('.mission-success')?.scrollIntoView({block:'center',behavior:scrollBehavior()});$('.mission-success .btn')?.focus({preventScroll:true});announce('Mission accomplie. '+m.takeaway);}return;}
    if(action==='report'){renderReport();return;}
    if(action==='finalize'){if(C.canReport(game,state)){state.reportReady=true;state.completedAt=state.completedAt||new Date().toISOString();save();const position=window.scrollY;renderReport(true);window.scrollTo(0,position);$('#export-box')?.scrollIntoView({block:'center',behavior:scrollBehavior()});$('[data-action="download"]')?.focus({preventScroll:true});announce('Ton bilan est prêt à télécharger.');}return;}
    if(action==='expected'){state.reportExampleUsed=true;save();showDialog('Éléments attendus de la note','<p>'+esc(game.report.example)+'</p><p class="help">Compare le raisonnement à ta rédaction. Plusieurs formulations sont possibles ; ce texte ne donne pas de note automatique.</p>');return;}
    if(action==='download'){downloadPDF(button);return;}
    if(action==='download-text'){if(!C.canReport(game,state)||!state.reportReady)return;const blob=new Blob(['\ufeff'+resultText()],{type:'text/plain;charset=utf-8'});const u=URL.createObjectURL(blob),a=document.createElement('a');a.href=u;a.download='Bilan_NCR_'+game.id.toUpperCase()+'_'+(state.pseudo||'apprenant').normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[^a-zA-Z0-9_-]/g,'_').slice(0,40)+'.txt';document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),1500);toast('Téléchargement du bilan demandé. Vérifie ton dossier Téléchargements.');return;}
    if(action==='print'){if(!C.canReport(game,state)||!state.reportReady)return;renderPrint();window.print();return;}
    if(action==='reset'){showDialog('Commencer une nouvelle session ?','<p>Cette action efface uniquement la progression de <strong>'+esc(game.year)+'</strong> sur cet appareil. Télécharge d’abord le bilan si tu veux conserver ton travail.</p><div class="dialog-actions"><button class="btn secondary" data-action="close">Garder ma session</button><button class="btn dark" data-action="confirm-reset">Effacer et recommencer</button></div>');return;}
    if(action==='confirm-reset'){closeDialog();state=C.fresh(game);openHints.clear();save();renderBrief();focusMain();return;}
  });
  dialog.addEventListener('click',e=>{if(e.target===dialog){const r=dialog.getBoundingClientRect();if(e.clientX<r.left||e.clientX>r.right||e.clientY<r.top||e.clientY>r.bottom)closeDialog();}});
  dialog.addEventListener('cancel',()=>{if(lastFocus?.isConnected)window.setTimeout(()=>lastFocus.focus(),0);});
  function route(){const page=single?location.hash.slice(1):document.body.dataset.page;openHints.clear();if(Object.prototype.hasOwnProperty.call(games,page)){const year=catalog.sessions.find(x=>x.gameId===page)?.year;if(!year||!grants.has(year)){renderAccess(year||1,page);focusMain();return;}activeYear=year;game=games[page];state=read(game.id);document.title=game.title+' · GO '+game.year+' · NCR';if(state.started){if(state.reportReady&&C.coreDone(game,state))renderReport();else {if(!C.unlocked(game,state,state.mission))state.mission=0;renderMission();}}else renderBrief();}else{document.title='NCR · Missions BTS MCO';renderHub();}focusMain();}
  if(single)window.addEventListener('hashchange',route);
  window.addEventListener('pagehide',save);
  setInterval(()=>{if(game&&state?.started&&view==='mission'&&!document.hidden){state.seconds+=1;if($('#clock'))$('#clock').textContent=clock();if(state.seconds%5===0)save();}},1000);
  route();
})();

</script>
